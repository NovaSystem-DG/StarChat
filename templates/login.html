<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarChat — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070d14;
  --card:#0f1923;
  --surface:#172030;
  --blue:#4f8ef7;
  --blue2:#2563eb;
  --text:#dde6f0;
  --text2:#6b84a0;
  --text3:#3a5068;
  --border:rgba(255,255,255,0.07);
  --danger:#ef4444;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  position:relative;overflow:hidden;
}
/* subtle grid bg */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(79,142,247,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,142,247,.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}
/* glow orbs */
.orb{
  position:fixed;border-radius:50%;pointer-events:none;filter:blur(80px);
}
.orb1{width:400px;height:400px;background:rgba(37,99,235,.12);top:-100px;left:-100px;}
.orb2{width:300px;height:300px;background:rgba(79,142,247,.08);bottom:-80px;right:-60px;}

.card{
  width:100%;max-width:380px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px 32px;
  position:relative;z-index:1;
  box-shadow:0 32px 80px rgba(0,0,0,.6);
  animation:up .4s cubic-bezier(.16,1,.3,1);
}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.logo{text-align:center;margin-bottom:32px;}
.logo-mark{
  width:60px;height:60px;border-radius:18px;
  background:linear-gradient(135deg,#1d3a6e,#0e2040);
  border:1px solid rgba(79,142,247,.3);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:1.6rem;margin-bottom:14px;
  box-shadow:0 0 30px rgba(79,142,247,.15);
}
.logo h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;color:var(--text);}
.logo p{font-size:12px;color:var(--text3);margin-top:4px;letter-spacing:.03em;}

.field{margin-bottom:14px;}
.field label{
  display:block;font-size:10px;font-weight:600;
  color:var(--text3);letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:6px;
}
.input-wrap{position:relative;}
.input-wrap i.ico{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:.8rem;pointer-events:none;transition:.2s;
}
.input-wrap input{
  width:100%;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;
  padding:11px 12px 11px 38px;
  color:var(--text);font-family:inherit;font-size:14px;outline:none;
  transition:.2s;
}
.input-wrap input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(79,142,247,.1);
}
.input-wrap input:focus~i.ico{color:var(--blue);}
.input-wrap input::placeholder{color:var(--text3);}
.eye-btn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--text3);cursor:pointer;
  padding:4px 6px;border-radius:6px;font-size:.8rem;transition:.15s;
}
.eye-btn:hover{color:var(--text2);}

.err{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
  border-radius:8px;padding:9px 12px;
  font-size:12px;color:#fca5a5;
  display:flex;align-items:center;gap:7px;
  margin-bottom:12px;animation:shake .35s ease;
}
.err.hidden{display:none;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}

.btn{
  width:100%;background:var(--blue);border:none;border-radius:10px;
  padding:12px;color:#fff;font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(79,142,247,.3);margin-top:4px;
}
.btn:hover:not(:disabled){background:var(--blue2);box-shadow:0 6px 20px rgba(79,142,247,.4);transform:translateY(-1px);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.fa-spinner{animation:spin .7s linear infinite;}

.foot{
  text-align:center;margin-top:20px;
  font-size:11px;color:var(--text3);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.foot i{color:var(--blue);opacity:.6;}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-mark">💬</div>
    <h1>StarChat</h1>
    <p>Tu espacio de roleplay privado</p>
  </div>

  <div class="field">
    <label>Usuario</label>
    <div class="input-wrap">
      <i class="fas fa-user ico"></i>
      <input type="text" id="username" placeholder="Tu usuario"
        autocomplete="username" autocapitalize="none" spellcheck="false"
        onkeydown="onKey(event)">
    </div>
  </div>

  <div class="field">
    <label>Contraseña</label>
    <div class="input-wrap">
      <i class="fas fa-lock ico"></i>
      <input type="password" id="password" placeholder="Tu contraseña"
        autocomplete="current-password" onkeydown="onKey(event)">
      <button class="eye-btn" onclick="toggleEye()" type="button" tabindex="-1">
        <i class="fas fa-eye" id="eyeIco"></i>
      </button>
    </div>
  </div>

  <div class="err hidden" id="err">
    <i class="fas fa-circle-exclamation"></i>
    <span id="errTxt"></span>
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">
    <i class="fas fa-arrow-right-to-bracket" id="btnIco"></i>
    <span id="btnTxt">Entrar</span>
  </button>

  <p class="foot"><i class="fas fa-shield-halved"></i> Acceso privado</p>
</div>

<script>
function toggleEye(){
  const inp=document.getElementById('password'),ico=document.getElementById('eyeIco');
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  ico.className=show?'fas fa-eye-slash':'fas fa-eye';
  inp.focus();
}
function onKey(e){if(e.key==='Enter')doLogin();}
function showErr(msg){
  const el=document.getElementById('err');
  document.getElementById('errTxt').textContent=msg;
  el.classList.remove('hidden');
  el.style.animation='none';el.offsetHeight;el.style.animation='';
}
function setLoad(v){
  const btn=document.getElementById('loginBtn');
  btn.disabled=v;
  document.getElementById('btnIco').className=v?'fas fa-spinner':'fas fa-arrow-right-to-bracket';
  document.getElementById('btnTxt').textContent=v?'Entrando...':'Entrar';
}
async function doLogin(){
  document.getElementById('err').classList.add('hidden');
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  if(!u)return showErr('Ingresa tu usuario.');
  if(!p)return showErr('Ingresa tu contraseña.');
  setLoad(true);
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(r.ok){
      document.getElementById('loginBtn').style.background='#16a34a';
      document.getElementById('btnIco').className='fas fa-check';
      document.getElementById('btnTxt').textContent='¡Bienvenido!';
      setTimeout(()=>location.href='/',500);
    }else{
      setLoad(false);
      showErr(d.error||'Datos incorrectos.');
      document.getElementById('password').value='';
    }
  }catch{
    setLoad(false);
    showErr('Error de conexión.');
  }
}
document.getElementById('username').focus();
</script>
</body>
</html>
